name: Build plugin, desktop and Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check release signing credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Set the ANDROID_KEYSTORE_PASSWORD repository Secret before publishing a release.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            apps/mobile/package-lock.json
            app/package-lock.json
      - name: Check release versions and notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-release.cjs
      - run: node --test scripts/release-target.test.cjs
      - run: npm ci --no-fund --no-audit
        working-directory: ds-bot
      - run: npm run harness
        working-directory: ds-bot
      - run: npm test -- --test-concurrency=2
        working-directory: ds-bot
      - run: node scripts/build-client.mjs --check
        working-directory: ds-bot
      - run: npm run lint
        working-directory: ds-bot
      - run: npm test
        working-directory: packages/mobile-sdk
      - run: npm ci --no-fund --no-audit
        working-directory: apps/mobile
      - run: npm run typecheck && npm test
        working-directory: apps/mobile
      - run: python3 -m unittest discover -s apps/mobile/scripts -p 'test_*.py'
      - name: Pack tested plugin
        working-directory: ds-bot
        run: |
          mkdir -p ../out/plugin
          npm pack --pack-destination ../out/plugin
          cd ../out/plugin
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-plugin
          path: out/plugin/
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, label: arm64 }
          - { abi: x86_64, label: x86_64 }
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DS_BOT_ANDROID_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-fund --no-audit
      - run: npx --no-install expo prebuild --platform android --no-install
      - name: Build standalone release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=${{ matrix.abi }}
      - name: Sign APK when release password is configured
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../../out/android-${{ matrix.label }}
          src=android/app/build/outputs/apk/release/app-release-unsigned.apk
          dest=../../out/android-${{ matrix.label }}
          if [[ '${{ github.event_name }}' != 'pull_request' && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            bash scripts/sign-android.sh "$src" "$dest/dsbot-android-${{ matrix.label }}.apk"
            cp signing/DeepSeekBot.cer signing/certificate.sha256 "$dest/"
          else
            echo '::warning::Signing is unavailable (PR or missing ANDROID_KEYSTORE_PASSWORD). This artifact is unsigned and cannot be installed. Configure the repository Secret and run on main.'
            cp "$src" "$dest/dsbot-android-${{ matrix.label }}-unsigned.apk"
          fi
          cd "$dest"
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-android-${{ matrix.label }}
          path: out/android-${{ matrix.label }}/
          if-no-files-found: error

  desktop-windows:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-r')
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - run: node scripts/check-packed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-desktop-windows
          path: |
            app/dist-pack/*.exe
            app/dist-pack/*.blockmap
            app/dist-pack/latest.yml
          if-no-files-found: error

  desktop-macos:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-r')
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
        env:
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-desktop-macos-${{ matrix.arch }}
          path: app/dist-pack/*.zip
          if-no-files-found: error

  release:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.result == 'success' &&
      needs.android.result == 'success' &&
      (
        (contains(github.ref_name, '-r') &&
          needs.desktop-windows.result == 'skipped' &&
          needs.desktop-macos.result == 'skipped') ||
        (!contains(github.ref_name, '-r') &&
          needs.desktop-windows.result == 'success' &&
          needs.desktop-macos.result == 'success')
      )
    needs: [validate, android, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish matching plugin and signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if find out -name '*-unsigned.apk' | grep -q .; then
            echo 'A release requires ANDROID_KEYSTORE_PASSWORD and signed APKs.' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { releaseTarget } = require('./scripts/release-target.cjs');
          const target = releaseTarget(process.env.RELEASE_TAG);
          fs.writeFileSync('release-target.json', JSON.stringify(target));
          NODE
          version=$(node -p "require('./release-target.json').version")
          revision=$(node -p "require('./release-target.json').revision")
          publish_tag=$(node -p "require('./release-target.json').releaseTag")
          plugin_file=$(node -p "require('./release-target.json').pluginFile")
          notes_file=$(node -p "require('./release-target.json').notesFile")
          sums_file=$(node -p "require('./release-target.json').checksumsFile")
          mkdir release
          if [[ -z "$revision" ]]; then
            cp out/dsbot-desktop-windows/*.exe out/dsbot-desktop-windows/*.blockmap out/dsbot-desktop-windows/latest.yml release/
            cp out/dsbot-desktop-macos-arm64/*.zip out/dsbot-desktop-macos-x64/*.zip release/
          fi
          if [[ -n "$revision" ]]; then
            mkdir legacy
            gh release download "$publish_tag" --repo "$REPOSITORY" --dir legacy \
              --pattern "ds-bot-$version.tgz" --pattern SHA256SUMS --pattern DeepSeekBot.cer
            node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const name = 'ds-bot-' + require('./release-target.json').version + '.tgz';
          const lines = fs.readFileSync('legacy/SHA256SUMS', 'utf8').trim().split('\n');
          const expected = lines.map(line => line.trim().split(/\s+/)).find(row => row[1] === name)?.[0];
          const actual = crypto.createHash('sha256').update(fs.readFileSync('legacy/' + name)).digest('hex');
          if (!expected || expected !== actual) throw new Error('Original plugin checksum does not match');
          if (!fs.readFileSync('legacy/DeepSeekBot.cer').equals(fs.readFileSync('out/dsbot-android-arm64/DeepSeekBot.cer'))) throw new Error('Revision signing identity differs from the original release');
          NODE
          fi
          cp "out/dsbot-plugin/ds-bot-$version.tgz" "release/$plugin_file"
          cp out/dsbot-android-arm64/DeepSeekBot.cer release/
          cp out/dsbot-android-arm64/dsbot-android-arm64.apk "release/dsbot-android-arm64-$RELEASE_TAG.apk"
          cp out/dsbot-android-x86_64/dsbot-android-x86_64.apk "release/dsbot-android-x86_64-$RELEASE_TAG.apk"
          notes="$GITHUB_WORKSPACE/$notes_file"
          cd release
          if [[ -z "$revision" ]]; then
            desktop_assets=( ./*.exe ./*.blockmap ./*.zip latest.yml )
            sha256sum *.tgz *.apk *.cer "${desktop_assets[@]}" > "$sums_file"
          else
            desktop_assets=()
            sha256sum *.tgz *.apk *.cer > "$sums_file"
          fi
          if [[ -n "$revision" ]]; then
            existing=$(gh release view "$publish_tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
            for asset in "$plugin_file" ./*.apk "$sums_file"; do
              if printf '%s\n' "$existing" | grep -Fxq "${asset#./}"; then
                echo 'A file from this revision is already published; use a new revision tag.' >&2
                exit 1
              fi
            done
            gh release upload "$publish_tag" "$plugin_file" ./*.apk "$sums_file" \
              --repo "$REPOSITORY"
            gh release edit "$publish_tag" --repo "$REPOSITORY" --title "DS Bot $publish_tag" \
              --notes-file "$notes"
          else
            if gh release view "$publish_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
              echo 'The stable release already exists; refusing to replace its desktop update metadata.' >&2
              exit 1
            fi
            gh release create "$publish_tag" "$plugin_file" ./*.apk "$sums_file" DeepSeekBot.cer "${desktop_assets[@]}" \
              --repo "$REPOSITORY" --title "DS Bot $publish_tag" --notes-file "$notes" --verify-tag
          fi

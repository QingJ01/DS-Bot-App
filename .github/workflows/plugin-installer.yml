name: Verify and publish plugin installer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/plugin-installer/**'
      - 'scripts/build-plugin-installer.py'
      - 'scripts/test-plugin-install.py'
      - 'scripts/test-github-install.py'
      - 'scripts/release-target.cjs'
      - 'releases/plugin-install.json'
      - '.github/workflows/plugin-installer.yml'
  pull_request:
    paths:
      - 'scripts/plugin-installer/**'
      - 'scripts/build-plugin-installer.py'
      - 'scripts/test-plugin-install.py'
      - 'scripts/test-github-install.py'
      - 'scripts/release-target.cjs'
      - 'releases/plugin-install.json'
      - '.github/workflows/plugin-installer.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Add the tested installer ZIP to its recorded release (never replace existing assets)

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pnpm version used by DSH
        run: npm install --global pnpm@11.7.0 --ignore-scripts --no-audit --no-fund
      - name: Read the immutable release metadata
        id: metadata
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const release = require('./scripts/plugin-installer/release.json');
          const { releaseTarget } = require('./scripts/release-target.cjs');
          const target = releaseTarget(release.revision);
          if (release.version !== target.version || release.archive !== target.pluginFile) throw new Error('Inconsistent installer release metadata');
          console.log(`tag=${target.releaseTag}`);
          console.log(`archive=${release.archive}`);
          NODE
      - name: Download immutable plugin and build installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          mkdir -p input
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir input
          python scripts/build-plugin-installer.py --archive "input/$ARCHIVE" --output out/plugin-installer
      - name: Test cold, cached, failed and frozen installs
        env:
          DSBOT_PLUGIN_ARCHIVE: input/${{ steps.metadata.outputs.archive }}
          NO_UPDATE_NOTIFIER: '1'
        run: python scripts/test-plugin-install.py
      - name: Verify the public one-line GitHub installation
        env:
          DSBOT_PLUGIN_ARCHIVE: input/${{ steps.metadata.outputs.archive }}
          NO_UPDATE_NOTIFIER: '1'
        run: python scripts/test-github-install.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dsbot-plugin-installer
          path: out/plugin-installer/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-plugin-installer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsbot-plugin-installer
          path: installer
      - name: Add installer without changing any existing downloads
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(node -p "require('../scripts/plugin-installer/release.json').revision")
          tag=$(node -p "'v' + require('../scripts/plugin-installer/release.json').version")
          sha256sum --check "SHA256SUMS-installer-$revision"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing.txt
          for name in "dsbot-plugin-installer-$revision.zip" "SHA256SUMS-installer-$revision"; do
            if grep -Fxq "$name" existing.txt; then
              echo "::error::Asset already exists: $name. Use a new installer revision."
              exit 1
            fi
          done
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "dsbot-plugin-installer-$revision.zip" "SHA256SUMS-installer-$revision"

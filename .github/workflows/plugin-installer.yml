name: Verify and publish plugin installer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/plugin-installer/**'
      - 'scripts/build-plugin-installer.py'
      - 'scripts/test-plugin-install.py'
      - 'scripts/test-github-install.py'
      - 'releases/plugin-install.json'
      - '.github/workflows/plugin-installer.yml'
  pull_request:
    paths:
      - 'scripts/plugin-installer/**'
      - 'scripts/build-plugin-installer.py'
      - 'scripts/test-plugin-install.py'
      - 'scripts/test-github-install.py'
      - 'releases/plugin-install.json'
      - '.github/workflows/plugin-installer.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Add the tested installer ZIP to v0.1.2 (never replace existing assets)

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pnpm version used by DSH
        run: npm install --global pnpm@11.7.0 --ignore-scripts --no-audit --no-fund
      - name: Download immutable plugin and build installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download v0.1.2 --repo "$GITHUB_REPOSITORY" --pattern ds-bot-0.1.2-r1.tgz --dir input
          python scripts/build-plugin-installer.py --archive input/ds-bot-0.1.2-r1.tgz --output out/plugin-installer
      - name: Test cold, cached, failed and frozen installs
        env:
          DSBOT_PLUGIN_ARCHIVE: input/ds-bot-0.1.2-r1.tgz
          NO_UPDATE_NOTIFIER: '1'
        run: python scripts/test-plugin-install.py
      - name: Verify the public one-line GitHub installation
        env:
          DSBOT_PLUGIN_ARCHIVE: input/ds-bot-0.1.2-r1.tgz
          NO_UPDATE_NOTIFIER: '1'
        run: python scripts/test-github-install.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dsbot-plugin-installer
          path: out/plugin-installer/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-plugin-installer-v012-r1
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsbot-plugin-installer
          path: installer
      - name: Add installer without changing any existing downloads
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS-installer-v0.1.2-r1
          gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing.txt
          for name in dsbot-plugin-installer-v0.1.2-r1.zip SHA256SUMS-installer-v0.1.2-r1; do
            if grep -Fxq "$name" existing.txt; then
              echo "::error::Asset already exists: $name. Use a new installer revision."
              exit 1
            fi
          done
          gh release upload v0.1.2 --repo "$GITHUB_REPOSITORY" dsbot-plugin-installer-v0.1.2-r1.zip SHA256SUMS-installer-v0.1.2-r1

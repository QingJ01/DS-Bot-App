appId: io.github.qingj01.dsbotapp
productName: DS Bot App
copyright: Copyright 2026 Fei2411, QingJ01 and the DS Bot contributors
artifactName: DS-Bot-App-${version}-${os}-${arch}.${ext}
directories:
  output: dist-pack
files:
  - package.json
  - src/**
  - assets/**
# The Host runs pnpm as a separate Node process to install plugins, so it must be a plain file.
asarUnpack:
  - node_modules/pnpm/**
# node-pty, sharp and koffi ship prebuilt binaries for each platform. A rebuild would compile
# node-pty from source and needs a C++ toolchain.
npmRebuild: false
# So the binaries come from npm as it installed them; a build for another architecture stops.
beforePack: ./scripts/before-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerLanguages: [zh_CN, en_US]
  multiLanguageInstaller: true
mac:
  # A zip, not a dmg: macOS 26 calls a downloaded unsigned dmg damaged and will not open it (#351).
  target: zip
  # Ad-hoc signing seals the bundle; no Developer ID or notarization.
  identity: '-'
  hardenedRuntime: false
  icon: assets/icon.png
  category: public.app-category.productivity
linux:
  # One AppImage runs on every distribution and updates itself; the deb is for Debian/Ubuntu,
  # where it avoids Ubuntu 24.04's AppArmor question of an AppImage and adds a menu entry.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # The binary and the deb's menu entry take this name; productName has a space, which a
  # terminal command should not have.
  executableName: ds-bot-app
  # A deb needs a maintainer; package.json's author has no email, so it goes here.
  maintainer: QingJ01 <https://github.com/QingJ01>
  # Links the running window to the menu entry (WM_CLASS = app id).
  syncDesktopName: true
  icon: assets/icon.png
  category: Utility
appImage:
  artifactName: DS-Bot-App-${version}-linux-x86_64.AppImage
deb:
  artifactName: DS-Bot-App-${version}-linux-amd64.deb
# Where the installed app looks for updates (app-update.yml in the package). The build writes
# latest.yml beside the installer; the release workflow attaches both to the GitHub release,
# so the build itself never publishes (--publish never).
publish:
  provider: github
  owner: QingJ01
  repo: DS-Bot-App
